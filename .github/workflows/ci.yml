name: SupportPulse CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore ./Backend/Backend.csproj
      
    - name: Build Backend
      run: dotnet build ./Backend/Backend.csproj -c Release --no-restore
      
    - name: Run Tests
      # Note: Integration tests ke liye action runner me fake env vars zaroori hain
      run: dotnet test ./backend.Tests/backend.Tests.csproj --no-build --verbosity normal

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Build React App
      working-directory: ./frontend
      run: npm run build