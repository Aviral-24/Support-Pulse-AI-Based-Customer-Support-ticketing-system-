name: SupportPulse CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test-backend:
    runs-on: ubuntu-latest
    
    # 🔥 PROACTIVE FIX: GitHub Actions me Database aur Redis add kar diya 
    # Taaki aapke Integration Tests bina kisi Connection Error ke pass ho jayein!
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Abhi@2080
          POSTGRES_DB: SupportPulse_db
        ports:
          - 5433:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      # 🔥 FIX: Ab hum Backend aur Tests dono ko ek sath restore aur build karenge
      run: dotnet restore ./Backend.Tests/Backend.Tests.csproj
      
    - name: Build Backend & Tests
      run: dotnet build ./Backend.Tests/Backend.Tests.csproj -c Release --no-restore
      
    - name: Run Tests
      run: dotnet test ./Backend.Tests/Backend.Tests.csproj -c Release --no-build --verbosity normal

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      working-directory: ./Frontend
      run: npm ci
      
    - name: Build React App
      working-directory: ./Frontend
      run: npm run build