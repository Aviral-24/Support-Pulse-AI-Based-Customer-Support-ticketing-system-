name: SupportPulse CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test-backend:
    runs-on: ubuntu-latest

    env:
      DB_USER: postgres
      DB_PASS: ${{ secrets.DB_PASS != '' && secrets.DB_PASS || 'postgres' }}
      DB_NAME: ${{ secrets.DB_NAME != '' && secrets.DB_NAME || 'SupportPulse_db' }}
      JWT_KEY: ${{ secrets.JWT_KEY != '' && secrets.JWT_KEY || 'change_me_in_env' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY != '' && secrets.GROQ_API_KEY || 'test_groq_api_key' }}
      HF_API_KEY: ${{ secrets.HF_API_KEY != '' && secrets.HF_API_KEY || 'test_hf_api_key' }}
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER != '' && secrets.MINIO_ROOT_USER || 'minioadmin' }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD != '' && secrets.MINIO_ROOT_PASSWORD || 'minioadmin' }}

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DB_PASS != '' && secrets.DB_PASS || 'postgres' }}
          POSTGRES_DB: ${{ secrets.DB_NAME != '' && secrets.DB_NAME || 'SupportPulse_db' }}
        ports:
          - 5433:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Install EF Core CLI
      run: dotnet tool install --global dotnet-ef

    - name: Restore dependencies
      run: dotnet restore ./Unit_Tests/Unit_Tests.csproj

    - name: Build Backend & Tests
      run: dotnet build ./Unit_Tests/Unit_Tests.csproj -c Release --no-restore

    - name: Apply Database Migrations
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Port=5433;Database=${{ secrets.DB_NAME != '' && secrets.DB_NAME || 'SupportPulse_db' }};Username=postgres;Password=${{ secrets.DB_PASS != '' && secrets.DB_PASS || 'postgres' }}"
      run: dotnet ef database update --project ./Backend/Backend.csproj --startup-project ./Backend/Backend.csproj

    - name: Run Tests
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Port=5433;Database=${{ secrets.DB_NAME != '' && secrets.DB_NAME || 'SupportPulse_db' }};Username=postgres;Password=${{ secrets.DB_PASS != '' && secrets.DB_PASS || 'postgres' }}"
        ConnectionStrings__Redis: "localhost:6379,abortConnect=false"
        Groq__ApiKey: ${{ secrets.GROQ_API_KEY != '' && secrets.GROQ_API_KEY || 'test_groq_api_key' }}
        HuggingFace__ApiKey: ${{ secrets.HF_API_KEY != '' && secrets.HF_API_KEY || 'test_hf_api_key' }}
        Jwt__Key: ${{ secrets.JWT_KEY != '' && secrets.JWT_KEY || 'change_me_in_env' }}
        Jwt__Issuer: "SupportPulseAPI"
        Jwt__Audience: "SupportPulseClient"
      run: dotnet test ./Unit_Tests/Unit_Tests.csproj -c Release --no-build --verbosity normal --filter "FullyQualifiedName!~TicketAiIntegrationTests"

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: ./Frontend
      run: npm ci

    - name: Build React App
      working-directory: ./Frontend
      run: npm run build