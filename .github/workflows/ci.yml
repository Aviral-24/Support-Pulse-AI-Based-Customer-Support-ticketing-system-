name: SupportPulse CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Abhi@2080
          POSTGRES_DB: SupportPulse_db
        ports:
          - 5433:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Install EF Core CLI
      run: dotnet tool install --global dotnet-ef
        
    - name: Restore dependencies
      run: dotnet restore ./Backend.Tests/Backend.Tests.csproj
      
    - name: Build Backend & Tests
      run: dotnet build ./Backend.Tests/Backend.Tests.csproj -c Release --no-restore
      
    - name: Apply Database Migrations
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Port=5433;Database=SupportPulse_db;Username=postgres;Password=Abhi@2080"
      run: dotnet ef database update --project ./Backend/Backend.csproj --startup-project ./Backend/Backend.csproj
      
    - name: Run Tests
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Port=5433;Database=SupportPulse_db;Username=postgres;Password=Abhi@2080"
        ConnectionStrings__Redis: "localhost:6379,abortConnect=false"
        Groq__ApiKey: "dummy-groq-key-for-testing"
        HuggingFace__ApiKey: "dummy-hf-key-for-testing"
        Jwt__Key: "SuperSecretKeyForTesting12345678901234567890!"
        Jwt__Issuer: "SupportPulseAPI"
        Jwt__Audience: "SupportPulseClient"
      run: dotnet test ./Backend.Tests/Backend.Tests.csproj -c Release --no-build --verbosity normal

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      working-directory: ./Frontend
      run: npm ci
      
    - name: Build React App
      working-directory: ./Frontend
      run: npm run build